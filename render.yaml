# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kingcoin-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_NAME
        value: kingcoin
      - key: JWT_SECRET
        sync: false
      - key: SWAGGER_PASSWORD
        sync: false
      - key: APP_PUBLIC_URL
        value: https://king-coin-crypto-cex.vercel.app
      - key: BASE_URL
        value: https://kingcoin-mlnz.onrender.com
      - key: MARKET_MAKER_ENABLED
        value: "true"
